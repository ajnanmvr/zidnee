$kind: http-request
url: "{{baseUrl}}/api/permissions"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: >-
      if (pm.response.code === 200) {
        const body = pm.response.json();
        const firstPermissionId = body.permissions?.[0]?.id;
        if (firstPermissionId) pm.environment.set('permissionId', firstPermissionId);
      }
    language: text/javascript
order: 1000
